<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1450" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="seqHdrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <marker id="arrSeq" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- TITLE HEADER -->
  <rect x="30" y="25" width="1140" height="70" rx="12" fill="url(#seqHdrGrad)" stroke="#10b981" stroke-width="2" />
  <text x="600" y="58" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">VAANIRAKSHAK — REAL-TIME RUNTIME SEQUENCE DIAGRAM</text>
  <text x="600" y="82" text-anchor="middle" fill="#a7f3d0" font-size="13">Chronological Frame-by-Frame Streaming, Multi-Evidence Parallel Inference &amp; Emergency Intervention Loop</text>

  <!-- ACTOR COLUMNS HEADER -->
  <g transform="translate(40, 110)">
    <!-- Actor 1 -->
    <rect x="0" y="0" width="130" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" />
    <text x="65" y="22" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">Caller / Edge</text>
    <text x="65" y="38" text-anchor="middle" fill="#94a3b8" font-size="10">PSTN / VoIP</text>

    <!-- Actor 2 -->
    <rect x="160" y="0" width="140" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" />
    <text x="230" y="22" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">Android Client</text>
    <text x="230" y="38" text-anchor="middle" fill="#94a3b8" font-size="10">CallScreening HUD</text>

    <!-- Actor 3 -->
    <rect x="330" y="0" width="150" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1" />
    <text x="405" y="22" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">FastAPI Ingestion</text>
    <text x="405" y="38" text-anchor="middle" fill="#a5b4fc" font-size="10">WS Buffer Manager</text>

    <!-- Actor 4 -->
    <rect x="510" y="0" width="160" height="50" rx="8" fill="#312e81" stroke="#818cf8" />
    <text x="590" y="22" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">Parallel AI Engines</text>
    <text x="590" y="38" text-anchor="middle" fill="#c7d2fe" font-size="10">Voice/Speaker/STT/NLP</text>

    <!-- Actor 5 -->
    <rect x="700" y="0" width="140" height="50" rx="8" fill="#3b0764" stroke="#c084fc" />
    <text x="770" y="22" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">GRU Temporal Engine</text>
    <text x="770" y="38" text-anchor="middle" fill="#e9d5ff" font-size="10">Rolling State h_t</text>

    <!-- Actor 6 -->
    <rect x="870" y="0" width="130" height="50" rx="8" fill="#500724" stroke="#fb7185" />
    <text x="935" y="22" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">Decision Engine</text>
    <text x="935" y="38" text-anchor="middle" fill="#ffe4e6" font-size="10">Policy Rules</text>

    <!-- Actor 7 -->
    <rect x="1030" y="0" width="100" height="50" rx="8" fill="#022c22" stroke="#10b981" />
    <text x="1080" y="22" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">Dashboard</text>
    <text x="1080" y="38" text-anchor="middle" fill="#a7f3d0" font-size="10">React / WS</text>
  </g>

  <!-- LIFELINES (VERTICAL DASHED LINES) -->
  <path d="M 105 160 L 105 1400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <path d="M 270 160 L 270 1400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <path d="M 405 160 L 405 1400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <path d="M 590 160 L 590 1400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <path d="M 770 160 L 770 1400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <path d="M 935 160 L 935 1400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <path d="M 1080 160 L 1080 1400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- SEQUENCE EVENTS -->

  <!-- Event 1: Incoming call -->
  <g transform="translate(0, 190)">
    <path d="M 105 0 L 270 0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrSeq)" />
    <rect x="130" y="-12" width="115" height="18" rx="4" fill="#0f172a" />
    <text x="187" y="1" text-anchor="middle" fill="#7dd3fc" font-size="10">1. Incoming Call Event</text>
  </g>

  <!-- Event 2: Session Init -->
  <g transform="translate(0, 240)">
    <path d="M 270 0 L 405 0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrSeq)" />
    <rect x="290" y="-12" width="95" height="18" rx="4" fill="#0f172a" />
    <text x="337" y="1" text-anchor="middle" fill="#7dd3fc" font-size="10">2. WS Handshake</text>
  </g>

  <!-- STREAMING LOOP BOX -->
  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="1050" height="980" rx="10" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,4" />
    <rect x="10" y="10" width="220" height="24" rx="4" fill="#312e81" />
    <text x="120" y="26" text-anchor="middle" fill="#e0e7ff" font-size="11" font-weight="bold">STREAMING LOOP (Every 1–2s Chunk)</text>

    <!-- Event 3: Send Audio Chunk -->
    <g transform="translate(0, 50)">
      <path d="M 210 0 L 345 0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrSeq)" />
      <rect x="225" y="-12" width="105" height="18" rx="4" fill="#1e1b4b" />
      <text x="277" y="1" text-anchor="middle" fill="#a5b4fc" font-size="10">3. Base64 PCM Chunk</text>
    </g>

    <!-- Event 4: Dispatch Parallel AI -->
    <g transform="translate(0, 110)">
      <path d="M 345 0 L 530 0" stroke="#818cf8" stroke-width="2" marker-end="url(#arrSeq)" />
      <rect x="360" y="-12" width="155" height="18" rx="4" fill="#1e1b4b" />
      <text x="437" y="1" text-anchor="middle" fill="#c7d2fe" font-size="10">4. Dispatch Audio &amp; Preprocessing</text>
    </g>

    <!-- Event 5: Parallel Inferences -->
    <g transform="translate(530, 150)">
      <rect x="0" y="0" width="170" height="120" rx="6" fill="#1e1b4b" stroke="#6366f1" />
      <text x="85" y="20" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="bold">Parallel AI Inferences:</text>
      <text x="15" y="40" fill="#f43f5e" font-size="10">• Voice Synth: 0.94 (35ms)</text>
      <text x="15" y="60" fill="#fbbf24" font-size="10">• Speaker Sim: 0.42 (20ms)</text>
      <text x="15" y="80" fill="#38bdf8" font-size="10">• STT Transcribe: (90ms)</text>
      <text x="15" y="100" fill="#f43f5e" font-size="10">• Indic NLP: Money/OTP (25ms)</text>
    </g>

    <!-- Event 6: Send Evidence Vector -->
    <g transform="translate(0, 310)">
      <path d="M 530 0 L 710 0" stroke="#818cf8" stroke-width="2" marker-end="url(#arrSeq)" />
      <rect x="550" y="-12" width="140" height="18" rx="4" fill="#312e81" />
      <text x="620" y="1" text-anchor="middle" fill="#e0e7ff" font-size="10">5. Evidence Vector E_t</text>
    </g>

    <!-- Event 7: GRU Recurrence -->
    <g transform="translate(710, 350)">
      <rect x="0" y="0" width="140" height="60" rx="6" fill="#3b0764" stroke="#c084fc" />
      <text x="70" y="20" text-anchor="middle" fill="#f3e8ff" font-size="10" font-weight="bold">6. GRU Recurrence Update</text>
      <text x="70" y="38" text-anchor="middle" fill="#d8b4fe" font-size="10">h_t = GRU(h_{t-1}, E_t)</text>
      <text x="70" y="52" text-anchor="middle" fill="#f43f5e" font-size="10" font-weight="bold">Risk Score: 94 (CRITICAL)</text>
    </g>

    <!-- Event 8: Send Risk to Policy Engine -->
    <g transform="translate(0, 440)">
      <path d="M 710 0 L 875 0" stroke="#c084fc" stroke-width="2" marker-end="url(#arrSeq)" />
      <rect x="735" y="-12" width="125" height="18" rx="4" fill="#581c87" />
      <text x="797" y="1" text-anchor="middle" fill="#f3e8ff" font-size="10">7. Evaluate Policy (R_t = 94)</text>
    </g>

    <!-- Event 9: Decision Evaluation -->
    <g transform="translate(875, 480)">
      <rect x="0" y="0" width="120" height="55" rx="6" fill="#500724" stroke="#fb7185" />
      <text x="60" y="20" text-anchor="middle" fill="#ffe4e6" font-size="10" font-weight="bold">8. Policy Action</text>
      <text x="60" y="36" text-anchor="middle" fill="#f43f5e" font-size="10" font-weight="bold">INTERVENE</text>
      <text x="60" y="48" text-anchor="middle" fill="#fda4af" font-size="9">(10s Countdown)</text>
    </g>

    <!-- Event 10: Dispatch Risk Update to Android -->
    <g transform="translate(0, 560)">
      <path d="M 875 0 L 210 0" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrRed)" />
      <rect x="440" y="-12" width="210" height="18" rx="4" fill="#881337" />
      <text x="545" y="1" text-anchor="middle" fill="#ffe4e6" font-size="10">9. Risk Update: CRITICAL + 10s Countdown Payload</text>
    </g>

    <!-- Event 11: Dispatch Telemetry to Dashboard -->
    <g transform="translate(0, 620)">
      <path d="M 875 0 L 1020 0" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)" />
      <rect x="895" y="-12" width="110" height="18" rx="4" fill="#047857" />
      <text x="950" y="1" text-anchor="middle" fill="#a7f3d0" font-size="10">10. Live Radar &amp; Spectrogram</text>
    </g>

    <!-- Event 12: Android Intervention Overlay Render -->
    <g transform="translate(185, 660)">
      <rect x="0" y="0" width="140" height="60" rx="6" fill="#881337" stroke="#f43f5e" stroke-width="1.5" />
      <text x="70" y="20" text-anchor="middle" fill="#ffe4e6" font-size="10" font-weight="bold">11. Render Security HUD</text>
      <text x="70" y="38" text-anchor="middle" fill="#fecdd3" font-size="10">Floating Warning Modal +</text>
      <text x="70" y="52" text-anchor="middle" fill="#fda4af" font-size="10">10s Intervention Countdown</text>
    </g>

    <!-- Event 13: Emergency Family SOS Dispatch -->
    <g transform="translate(0, 750)">
      <path d="M 875 0 L 1020 0" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrRed)" />
      <rect x="890" y="-12" width="115" height="18" rx="4" fill="#881337" />
      <text x="947" y="1" text-anchor="middle" fill="#ffe4e6" font-size="10">12. Family Safety SOS</text>
    </g>

    <!-- Event 14: SHA-256 Forensics Sealing -->
    <g transform="translate(875, 790)">
      <rect x="0" y="0" width="120" height="50" rx="6" fill="#1e293b" stroke="#64748b" />
      <text x="60" y="20" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">13. SHA-256 Sealing</text>
      <text x="60" y="38" text-anchor="middle" fill="#94a3b8" font-size="9">Sec. 65B Audit Chain</text>
    </g>

    <!-- Event 15: Repeat Loop Arrow -->
    <g transform="translate(0, 870)">
      <path d="M 875 0 L 210 0" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrSeq)" />
      <rect x="460" y="-12" width="170" height="18" rx="4" fill="#1e1b4b" />
      <text x="545" y="1" text-anchor="middle" fill="#c7d2fe" font-size="10">14. Process Next Audio Chunk (Repeat)</text>
    </g>
  </g>

  <!-- POST CALL FORENSICS DOSSIER GENERATION -->
  <g transform="translate(40, 1290)">
    <rect x="0" y="0" width="1120" height="90" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="25" fill="#a7f3d0" font-size="12" font-weight="bold">POST-CALL SECURITY REPORT &amp; LEGAL EVIDENCE GENERATION</text>
    <text x="35" y="48" fill="#e2e8f0" font-size="11">• Section 65B Cyber Crime Forensic Dossier automatically created with chronological SHA-256 frame hash chain.</text>
    <text x="35" y="68" fill="#e2e8f0" font-size="11">• Formatted submission payload generated for National Cyber Crime Reporting Portal (CyberCrime 1930 / I4C).</text>
  </g>
</svg>
