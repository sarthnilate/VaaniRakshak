<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="depHdrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="dckrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <marker id="arrDep" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrTestDep" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316" />
    </marker>
  </defs>

  <!-- HEADER -->
  <rect x="30" y="25" width="1140" height="70" rx="12" fill="url(#depHdrGrad)" stroke="#334155" stroke-width="2" />
  <text x="600" y="58" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">VAANIRAKSHAK — DEPLOYMENT &amp; CONTAINER ARCHITECTURE</text>
  <text x="600" y="82" text-anchor="middle" fill="#94a3b8" font-size="13">Production Micro-Services, Docker Topology, Database Layer, Edge Clients &amp; Attack Lab Boundary</text>

  <!-- SECTION 1: EDGE CLIENTS & CARRIER FEED -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="700" height="180" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="20" y="28" fill="#38bdf8" font-size="14" font-weight="bold">CLIENT &amp; EDGE ACQUISITION LAYER</text>

    <!-- Client A: Android App -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="310" height="120" rx="8" fill="#0f172a" stroke="#0284c7" />
      <text x="155" y="22" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Android Security App (Kotlin)</text>
      <text x="155" y="42" text-anchor="middle" fill="#cbd5e1" font-size="11">• CallScreeningService &amp; Contact Policy</text>
      <text x="155" y="60" text-anchor="middle" fill="#cbd5e1" font-size="11">• Jetpack Compose Floating Security HUD</text>
      <text x="155" y="78" text-anchor="middle" fill="#cbd5e1" font-size="11">• Ktor / OkHttp WebSocket Streaming</text>
      <text x="155" y="98" text-anchor="middle" fill="#38bdf8" font-size="10">Target: Android 8.0+ (API 26+)</text>
    </g>

    <!-- Client B: Carrier Tap -->
    <g transform="translate(360, 42)">
      <rect x="0" y="0" width="320" height="120" rx="8" fill="#0f172a" stroke="#475569" stroke-dasharray="4,4" />
      <text x="160" y="22" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">Future Carrier Tap [PLANNED]</text>
      <text x="160" y="42" text-anchor="middle" fill="#64748b" font-size="11">• IMS / VoLTE Core gRPC Audio Tap</text>
      <text x="160" y="60" text-anchor="middle" fill="#64748b" font-size="11">• Zero app-side audio capture overhead</text>
      <text x="160" y="78" text-anchor="middle" fill="#64748b" font-size="11">• High-throughput enterprise gateway</text>
      <text x="160" y="98" text-anchor="middle" fill="#94a3b8" font-size="10">Operator / Enterprise Integration</text>
    </g>
  </g>

  <!-- SEPARATE ATTACK LAB CONTAINER (DASHED) -->
  <g transform="translate(770, 120)">
    <rect x="0" y="0" width="390" height="180" rx="12" fill="#451a03" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4" />
    <rect x="10" y="10" width="370" height="26" rx="5" fill="#ea580c" />
    <text x="195" y="27" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">ATTACK LAB CONTAINER (RESEARCH TOOL)</text>
    <text x="195" y="48" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="bold">SEPARATE CONTROLLED TEST HARNESS</text>
    <text x="195" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">• Pluggable Voice Generators (Bark/Coqui/OpenVoice)</text>
    <text x="195" y="86" text-anchor="middle" fill="#cbd5e1" font-size="11">• Telecom Degradation (AMR-WB, Packet Loss, Jitter)</text>
    <text x="195" y="104" text-anchor="middle" fill="#cbd5e1" font-size="11">• Provenance Watermarking &amp; Benchmark Injection</text>
    <text x="195" y="130" text-anchor="middle" fill="#fb923c" font-size="11" font-style="italic">Communicates via controlled test endpoints only</text>
    <text x="195" y="150" text-anchor="middle" fill="#fdba74" font-size="10">Not part of normal user production journey</text>
  </g>

  <!-- ARROWS TO DOCKER BACKEND -->
  <path d="M 195 300 L 195 370" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrDep)" fill="none" />
  <path d="M 965 300 L 965 370" stroke="#f97316" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrTestDep)" fill="none" />

  <rect x="120" y="325" width="150" height="18" rx="4" fill="#0f172a" />
  <text x="195" y="338" text-anchor="middle" fill="#7dd3fc" font-size="10">WebSocket / WSS:8000</text>

  <rect x="890" y="325" width="150" height="18" rx="4" fill="#451a03" />
  <text x="965" y="338" text-anchor="middle" fill="#fdba74" font-size="10">Test Injection REST:8000</text>


  <!-- DOCKER COMPOSE DEPLOYMENT ENVIRONMENT -->
  <g transform="translate(40, 370)">
    <rect x="0" y="0" width="1120" height="780" rx="14" fill="#0369a1" stroke="#0284c7" stroke-width="3" fill-opacity="0.15" />
    
    <!-- Docker Badge -->
    <rect x="20" y="15" width="280" height="32" rx="6" fill="url(#dckrGrad)" />
    <text x="160" y="36" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">DOCKER COMPOSE ECOSYSTEM</text>

    <!-- Container 1: Reverse Proxy -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="1080" height="60" rx="8" fill="#1e293b" stroke="#475569" />
      <text x="540" y="24" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">NGINX REVERSE PROXY &amp; TLS TERMINATION [OPTIONAL DEPLOYMENT GATEWAY]</text>
      <text x="540" y="44" text-anchor="middle" fill="#cbd5e1" font-size="11">TLS 1.3 / HTTPS / WSS Encryption  ·  Port 443 → Internal Port 8000 / 5173  ·  Rate Limiting &amp; CORS Policy</text>
    </g>

    <!-- Container 2: FastAPI Backend Engine -->
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="1080" height="340" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
      <rect x="10" y="10" width="1060" height="28" rx="5" fill="#312e81" />
      <text x="540" y="29" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">CONTAINER 1: VAANIRAKSHAK THREAT DEFENSE ENGINE (FastAPI / Uvicorn Server)</text>

      <g transform="translate(20, 50)">
        <!-- API Subsystems -->
        <rect x="0" y="0" width="320" height="130" rx="6" fill="#1e1b4b" stroke="#4338ca" />
        <text x="160" y="22" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">REST &amp; WebSocket Controllers</text>
        <text x="15" y="42" fill="#cbd5e1" font-size="10">• WebSocket Router: /ws/call/{session_id}</text>
        <text x="15" y="58" fill="#cbd5e1" font-size="10">• REST Session API: /api/v1/session</text>
        <text x="15" y="74" fill="#cbd5e1" font-size="10">• Forensics Exporter: /api/v1/forensics</text>
        <text x="15" y="90" fill="#cbd5e1" font-size="10">• Telemetry Router: /api/v1/telemetry</text>
        <text x="15" y="106" fill="#cbd5e1" font-size="10">• Jury Sandbox API: /api/v1/sandbox</text>

        <!-- AI Engine Subsystems -->
        <rect x="350" y="0" width="360" height="130" rx="6" fill="#1e1b4b" stroke="#4338ca" />
        <text x="530" y="22" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">Parallel AI Evidence Subsystems</text>
        <text x="365" y="42" fill="#cbd5e1" font-size="10">• Voice Authenticity (WavLM-AASIST-v1)</text>
        <text x="365" y="58" fill="#cbd5e1" font-size="10">• Speaker Verification (ECAPA-TDNN 192-d)</text>
        <text x="365" y="74" fill="#cbd5e1" font-size="10">• Multilingual STT (faster-whisper Engine)</text>
        <text x="365" y="90" fill="#cbd5e1" font-size="10">• Indic NLP Intelligence (XLM-R / Pattern Rules)</text>
        <text x="365" y="106" fill="#cbd5e1" font-size="10">• Audio Processor (Base64, VAD, FFT Spectrogram)</text>

        <!-- Risk & Decision Engines -->
        <rect x="730" y="0" width="310" height="130" rx="6" fill="#1e1b4b" stroke="#4338ca" />
        <text x="885" y="22" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">Temporal Risk &amp; Decision Engines</text>
        <text x="745" y="42" fill="#cbd5e1" font-size="10">• GRU Rolling Hidden State Tracker (h_t)</text>
        <text x="745" y="58" text-anchor="start" fill="#cbd5e1" font-size="10">• Dynamic Risk Aggregator (0 – 100)</text>
        <text x="745" y="74" fill="#cbd5e1" font-size="10">• Deterministic Policy Rule Engine</text>
        <text x="745" y="90" fill="#cbd5e1" font-size="10">• SHA-256 Forensics Hash Sealer</text>
        <text x="745" y="106" fill="#cbd5e1" font-size="10">• Emergency SOS Payload Dispatcher</text>

        <!-- Python Environment Info -->
        <rect x="0" y="145" width="1040" height="120" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="520" y="165" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">Runtime Environment: Python 3.11  ·  FastAPI 0.141+  ·  Uvicorn ASGI Server</text>
        <text x="20" y="190" fill="#cbd5e1" font-size="10">Dependencies: PyTorch, NumPy, SoundFile, Pydantic v2, SQLAlchemy, Redis-py, AsyncPG, Pytest</text>
        <text x="20" y="210" fill="#cbd5e1" font-size="10">Configuration: Loaded from environment variables (.env / config.py: Settings)</text>
        <text x="20" y="230" fill="#a7f3d0" font-size="10" font-weight="bold">Health &amp; Diagnostics Endpoint: GET /api/v1/health  (100% Green Gates Verified)</text>
      </g>
    </g>

    <!-- Container 3: Redis Session Store -->
    <g transform="translate(20, 500)">
      <rect x="0" y="0" width="520" height="140" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
      <rect x="10" y="10" width="500" height="26" rx="5" fill="#7f1d1d" />
      <text x="260" y="27" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">CONTAINER 2: REDIS SESSION &amp; STREAM CACHE (redis:7-alpine)</text>

      <text x="20" y="55" fill="#fca5a5" font-size="11">• Key: <tspan font-weight="bold">call:session:{session_id}</tspan> — Live risk score, GRU hidden state h_t</text>
      <text x="20" y="73" fill="#fca5a5" font-size="11">• Key: <tspan font-weight="bold">call:stream:{session_id}</tspan> — Audio chunk buffer (16kHz PCM)</text>
      <text x="20" y="91" fill="#fca5a5" font-size="11">• Automatic Expiry: <tspan font-weight="bold">30-minute TTL</tspan> post call teardown</text>
      <text x="20" y="115" fill="#cbd5e1" font-size="10">Role: In-memory real-time state coordinator &amp; API rate limiter</text>
    </g>

    <!-- Container 4: PostgreSQL / SQLite Database -->
    <g transform="translate(560, 500)">
      <rect x="0" y="0" width="540" height="140" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
      <rect x="10" y="10" width="520" height="26" rx="5" fill="#1e3a8a" />
      <text x="270" y="27" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">CONTAINER 3: PERSISTENT DATABASE (PostgreSQL / Supabase)</text>

      <text x="20" y="55" fill="#93c5fd" font-size="11">• Table: <tspan font-weight="bold">users</tspan> — User registration &amp; defense policy settings</text>
      <text x="20" y="73" fill="#93c5fd" font-size="11">• Table: <tspan font-weight="bold">enrolled_speakers</tspan> — 192-d ECAPA-TDNN vectors (pgvector)</text>
      <text x="20" y="91" fill="#93c5fd" font-size="11">• Table: <tspan font-weight="bold">incidents</tspan> — Forensic evidence dossiers &amp; SHA-256 audit log</text>
      <text x="20" y="115" fill="#cbd5e1" font-size="10">Fallback: SQLite aiosqlite (vaanirakshak.db) for zero-dependency local demo</text>
    </g>

    <!-- Container 5: React Command Center Dashboard -->
    <g transform="translate(20, 660)">
      <rect x="0" y="0" width="1080" height="95" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <rect x="10" y="10" width="1060" height="26" rx="5" fill="#064e3b" />
      <text x="540" y="27" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">CONTAINER 4: REACT COMMAND CENTER DASHBOARD (Vite / React 18 / TypeScript)</text>

      <text x="20" y="55" fill="#a7f3d0" font-size="11">• Components: Real-Time Risk Radar, Voice Spectrogram Gauge, Live Multilingual Transcript Stream, Incidents Audit Table</text>
      <text x="20" y="75" fill="#6ee7b7" font-size="11">• Features: Interactive Jury Evaluation Sandbox (🎯 JURY SANDBOX Navbar tab for wav/mp3/text testing)</text>
    </g>
  </g>

  <!-- SUMMARY FOOTER -->
  <g transform="translate(40, 1170)">
    <rect x="0" y="0" width="1120" height="60" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="560" y="25" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">DEPLOYMENT LAUNCH COMMANDS</text>
    <text x="560" y="45" text-anchor="middle" fill="#38bdf8" font-size="11">Backend: ./run_backend.sh  |  Dashboard: ./run_dashboard.sh  |  Test Suite: ./test_all.sh  |  Showcase: ./demo_showcase.sh</text>
  </g>
</svg>
