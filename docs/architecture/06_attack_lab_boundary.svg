<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="atkHdrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>

    <marker id="arrAtk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316" />
    </marker>
  </defs>

  <!-- HEADER -->
  <rect x="30" y="25" width="1140" height="70" rx="12" fill="url(#atkHdrGrad)" stroke="#ea580c" stroke-width="2" />
  <text x="600" y="58" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">ATTACK LAB ARCHITECTURAL BOUNDARY SPECIFICATION</text>
  <text x="600" y="82" text-anchor="middle" fill="#fdba74" font-size="13">Explicit Separation Between Controlled Research Test Harness and VaaniRakshak Production Defense System</text>

  <!-- LEFT BOX: ATTACK LAB (DASHED AMBER BOUNDARY) -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="500" height="660" rx="14" fill="#451a03" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="8,5" fill-opacity="0.25" />
    
    <rect x="20" y="18" width="460" height="34" rx="6" fill="#ea580c" />
    <text x="250" y="40" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">⚠️ SYSTEM A: ATTACK LAB (RESEARCH HARNESS)</text>
    <text x="250" y="72" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="bold">SEPARATE CONTROLLED TEST / ADVERSARIAL TOOL</text>

    <!-- Components -->
    <g transform="translate(20, 88)">
      <!-- Generator -->
      <rect x="0" y="0" width="460" height="120" rx="8" fill="#1c1917" stroke="#78350f" />
      <text x="230" y="24" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="bold">1. Modular Voice Generator Harness</text>
      <text x="20" y="48" fill="#cbd5e1" font-size="11">• Adapter pattern: <tspan font-weight="bold">VoiceGenerator (ABC)</tspan></text>
      <text x="20" y="68" fill="#cbd5e1" font-size="11">• Synthetic adapters: BarkXTTS, Coqui, OpenVoice, MockAudio</text>
      <text x="20" y="88" fill="#cbd5e1" font-size="11">• Generates controlled deepfake audio samples for benchmark evaluation</text>

      <!-- Degradation -->
      <rect x="0" y="135" width="460" height="130" rx="8" fill="#1c1917" stroke="#78350f" />
      <text x="230" y="24" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="bold">2. Telecom Degradation Simulator</text>
      <text x="20" y="48" fill="#cbd5e1" font-size="11">• Codec compression: AMR-WB (12.65 kbps), AMR-NB, G.711 μ-law</text>
      <text x="20" y="68" fill="#cbd5e1" font-size="11">• Bandwidth filtering: Narrowband (300Hz–3.4kHz), Wideband</text>
      <text x="20" y="88" fill="#cbd5e1" font-size="11">• Impairments: Street/Babble noise (SNR 5-25dB), 2-5% Packet Loss</text>

      <!-- Provenance -->
      <rect x="0" y="280" width="460" height="100" rx="8" fill="#1c1917" stroke="#78350f" />
      <text x="230" y="24" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="bold">3. Watermarking &amp; Provenance Registry</text>
      <text x="20" y="48" fill="#cbd5e1" font-size="11">• Cryptographic sample provenance tracking (`attack_lab_provenance`)</text>
      <text x="20" y="68" fill="#cbd5e1" font-size="11">• Ground-truth label tagging for automated benchmark verification</text>

      <!-- Explicit Disclaimers -->
      <rect x="0" y="395" width="460" height="150" rx="8" fill="#292524" stroke="#ea580c" />
      <text x="230" y="22" text-anchor="middle" fill="#ea580c" font-size="12" font-weight="bold">NOT PART OF VAANIRAKSHAK PRODUCT</text>
      <text x="20" y="44" fill="#fdba74" font-size="11">• NOT required for normal VaaniRakshak operation</text>
      <text x="20" y="64" fill="#fdba74" font-size="11">• NOT part of the Android client production application</text>
      <text x="20" y="84" fill="#fdba74" font-size="11">• NOT part of the production risk engine</text>
      <text x="20" y="104" fill="#fdba74" font-size="11">• Exists solely for SIH hackathon evaluation, research &amp; testing</text>
      <text x="20" y="128" fill="#ffffff" font-size="10" font-weight="bold">Endpoint: /api/v1/attack_lab  (Controlled Test Harness Endpoint)</text>
    </g>
  </g>

  <!-- ARROW FROM ATTACK LAB TO DEFENSE SYSTEM -->
  <g transform="translate(540, 420)">
    <path d="M 0 0 L 110 0" stroke="#ea580c" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrAtk)" />
    <rect x="10" y="-22" width="90" height="42" rx="6" fill="#451a03" stroke="#ea580c" />
    <text x="55" y="-6" text-anchor="middle" fill="#fdba74" font-size="10" font-weight="bold">Controlled Test</text>
    <text x="55" y="10" text-anchor="middle" fill="#fdba74" font-size="10" font-weight="bold">Audio Feed</text>
  </g>

  <!-- RIGHT BOX: VAANIRAKSHAK DEFENSE SYSTEM (SOLID BLUE/PURPLE BOUNDARY) -->
  <g transform="translate(660, 120)">
    <rect x="0" y="0" width="500" height="660" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2.5" />
    
    <rect x="20" y="18" width="460" height="34" rx="6" fill="#312e81" />
    <text x="250" y="40" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🛡️ SYSTEM B: VAANIRAKSHAK PRODUCTION DEFENSE</text>
    <text x="250" y="72" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">REAL-TIME MULTI-EVIDENCE CALL SECURITY ECOSYSTEM</text>

    <!-- Components -->
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="460" height="100" rx="8" fill="#0f172a" stroke="#4338ca" />
      <text x="230" y="24" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="bold">1. Android Edge Client (Kotlin / Compose)</text>
      <text x="20" y="48" fill="#cbd5e1" font-size="11">• Intercepts incoming calls via `CallScreeningService`</text>
      <text x="20" y="68" fill="#cbd5e1" font-size="11">• Floating security HUD &amp; 10s Emergency Intervention Overlay</text>

      <rect x="0" y="115" width="460" height="130" rx="8" fill="#0f172a" stroke="#4338ca" />
      <text x="230" y="24" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="bold">2. Real-Time Ingestion &amp; Multi-Evidence Pipeline</text>
      <text x="20" y="48" fill="#cbd5e1" font-size="11">• FastAPI Base64 16kHz PCM streaming WebSocket handler</text>
      <text x="20" y="68" fill="#cbd5e1" font-size="11">• Voice Authenticity (WavLM/AASIST) + Speaker Biometrics (ECAPA)</text>
      <text x="20" y="88" fill="#cbd5e1" font-size="11">• Multilingual STT (faster-whisper) + Indic NLP Intelligence</text>

      <rect x="0" y="260" width="460" height="110" rx="8" fill="#0f172a" stroke="#4338ca" />
      <text x="230" y="24" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="bold">3. GRU Temporal Risk &amp; Policy Decision Engine</text>
      <text x="20" y="48" fill="#cbd5e1" font-size="11">• Rolling GRU hidden state tracker ($h_t = \text{GRU}(h_{t-1}, x_t)$)</text>
      <text x="20" y="68" fill="#cbd5e1" font-size="11">• Dynamic Risk Score ($0 - 100$) + Rule-Based Policy Rules</text>
      <text x="20" y="88" fill="#cbd5e1" font-size="11">• Emergency Family SOS Alert Dispatcher</text>

      <rect x="0" y="385" width="460" height="160" rx="8" fill="#0f172a" stroke="#4338ca" />
      <text x="230" y="24" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="bold">4. Dashboard &amp; Section 65B Audit Forensics</text>
      <text x="20" y="48" fill="#cbd5e1" font-size="11">• React + Vite + TypeScript Command Center Dashboard</text>
      <text x="20" y="68" fill="#cbd5e1" font-size="11">• SHA-256 Tamper-Evident Evidence Frame Hash Chain</text>
      <text x="20" y="88" fill="#cbd5e1" font-size="11">• Section 65B Cyber Dossier &amp; CyberCrime 1930 Payload Exporter</text>
      <text x="20" y="112" fill="#a7f3d0" font-size="10" font-weight="bold">PRODUCTION DEFENSE SYSTEM — SIH 2026</text>
    </g>
  </g>

  <!-- SUMMARY FOOTER -->
  <g transform="translate(40, 800)">
    <rect x="0" y="0" width="1120" height="60" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="560" y="25" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">CRITICAL EVALUATION DISCIPLINE</text>
    <text x="560" y="45" text-anchor="middle" fill="#fdba74" font-size="11">Attack Lab is visually separated with a dashed boundary to ensure judges understand it is a controlled test tool, NOT a production feature.</text>
  </g>
</svg>
